ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }

    application {
        modules = [ io.paku.climblog.ApplicationKt.module ]
    }
}

jwt {
    secret = "secret-key-for-dev"
    secret = ${?JWT_SECRET}
    issuer = "http://0.0.0.0:8080/"
    issuer = ${?JWT_ISSUER}
    audience = "climblog"
    audience = ${?JWT_AUDIENCE}
    realm = "Access to Ktor Server"
}

db {
    driver = "org.h2.Driver"
    url = "jdbc:h2:file:./build/db/climblog"
    url = ${?DB_URL}
}

redis {
    host = "localhost"
    host = ${?REDIS_HOST}
    port = 6379
    port = ${?REDIS_PORT}
}

aws {
    accessKey = "dev-access-key"
    accessKey = ${?AWS_ACCESS_KEY}
    secretKey = "dev-secret-key"
    secretKey = ${?AWS_SECRET_KEY}
    region = "ap-northeast-2"
    region = ${?AWS_REGION}
    s3Bucket = "paku-climblog-service-dev"
    s3Bucket = ${?AWS_S3_BUCKET}
    cloudFrontDomain = "dgf5dci0xr7ne.cloudfront.net"
    cloudFrontDomain = ${?CLOUDFRONT_DOMAIN}
}

r2 {
    accountId = "dev-account-id"
    accountId = ${?R2_ACCOUNT_ID}
    accessKey = "dev-r2-access-key"
    accessKey = ${?R2_ACCESS_KEY}
    secretKey = "dev-r2-secret-key"
    secretKey = ${?R2_SECRET_KEY}
    bucket = "paku-climblog-service-dev"
    bucket = ${?R2_BUCKET}
    endpoint = "https://dev-account-id.r2.cloudflarestorage.com"
    endpoint = ${?R2_ENDPOINT}
    publicBaseUrl = "https://media.climblog.io"
    publicBaseUrl = ${?R2_PUBLIC_BASE_URL}
}

worker {
    authToken = "dev-worker-auth-token"
    authToken = ${?WORKER_AUTH_TOKEN}
}
